name: CNANO
description: 'CNANO (Jiangsu Cnano Technology Co., Ltd., Shanghai STAR Market 688116) is a carbon nanotube
  and graphene materials manufacturer founded in 2011 and headquartered in Zhenjiang, China, with a US arm
  (Cnano USA) in Santa Clara, California. It develops and mass-produces multi-wall and single-wall carbon
  nanotube powders, conductive pastes, graphene composite pastes, and conductive masterbatches used as
  additives in lithium-ion batteries, conductive polymer composites, antistatic coatings, and tire rubber
  reinforcement. It is one of the largest global producers of multi-wall carbon nanotubes for battery
  applications. Backed by IDG Capital. This is a physical-materials manufacturer with no public developer
  API, documentation portal, or SDK surface.'
